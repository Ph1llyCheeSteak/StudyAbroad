<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600"><rect width="1440" height="1600" fill="#F3E9DC"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#194F59">OPTION A / ICON DESIGN REFERENCE</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#194F59">Conversation meets exploration.</text><text x="70" y="175" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#194F59">Selected by Lucky · 14 November 2026 · Working brand study, pending team review</text><svg x="70" y="220" width="350" height="350" viewBox="0 0 512 512"><defs><linearGradient id="earth" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512"><stop stop-color="#194F59"/><stop offset="40%" stop-color="#47745E"/><stop offset="91%" stop-color="#A96F4D"/></linearGradient></defs><path fill="url(#earth)" d="M256 0 C373 0 431 0 471 41 C512 81 512 139 512 256 C512 373 512 431 471 471 C431 512 373 512 256 512 C139 512 81 512 41 471 C0 431 0 373 0 256 C0 139 0 81 41 41 C81 0 139 0 256 0 Z"/><g transform="translate(74 53) scale(.91)" fill="none" stroke="#fff" stroke-width="24.175824175824175" stroke-linecap="round" stroke-linejoin="round"><path d="M200 62.637362637362635 V35 M200 35 C98 35 18 110 18 210 C18 309 98 385 200 385 M200 357.1428571428571 V394"/></g><g transform="translate(260 243) scale(1) translate(-260 -243)"><path d="M260 122 C332 122 385 175 385 243 C385 268 378 290 365 310 L377 358 L328 345 C308 359 285 366 260 366 C190 366 135 312 135 243 C135 175 190 122 260 122 Z" fill="none" stroke="#fff" stroke-width="30.0" stroke-linejoin="round"/></g><path fill="#fff" d="M208 413 C211 405 218 401 229 401 H283 C294 401 301 405 304 413 L310 427 C312 432 309 436 303 436 H209 C203 436 200 432 202 427 Z"/></svg><svg x="465" y="220" width="350" height="350" viewBox="0 0 512 512"><defs><linearGradient id="earth" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512"><stop stop-color="#194F59"/><stop offset="40%" stop-color="#47745E"/><stop offset="91%" stop-color="#A96F4D"/></linearGradient><mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="black"/><g transform="translate(74 53) scale(.91)" fill="none" stroke="#fff" stroke-width="24.175824175824175" stroke-linecap="round" stroke-linejoin="round"><path d="M200 62.637362637362635 V35 M200 35 C98 35 18 110 18 210 C18 309 98 385 200 385 M200 357.1428571428571 V394"/></g><g transform="translate(260 243) scale(1) translate(-260 -243)"><path d="M260 122 C332 122 385 175 385 243 C385 268 378 290 365 310 L377 358 L328 345 C308 359 285 366 260 366 C190 366 135 312 135 243 C135 175 190 122 260 122 Z" fill="#fff" stroke="#fff" stroke-width="30.0" stroke-linejoin="round"/></g><path fill="#fff" d="M208 413 C211 405 218 401 229 401 H283 C294 401 301 405 304 413 L310 427 C312 432 309 436 303 436 H209 C203 436 200 432 202 427 Z"/></mask></defs><rect width="512" height="512" fill="white"/><rect width="512" height="512" fill="url(#earth)" mask="url(#mark)"/></svg><text x="870" y="250" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#194F59">Two official study treatments</text><text x="870" y="292" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#194F59">White outline / gradient field</text><text x="870" y="326" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#194F59">Filled gradient / white field</text><text x="870" y="375" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">One shared gradient behind a mask.</text><text x="870" y="408" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">No gradient restart per element.</text><text x="70" y="630" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#194F59">01 / CONSTRUCTION</text><text x="70" y="675" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">512 × 512 master coordinate system. Scale proportionally.</text><text x="70" y="706" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Bubble: 30 units / 5.859% of canvas width.</text><text x="70" y="737" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Arm and connectors: 22 effective units / 4.297%.</text><text x="70" y="768" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Bubble path bounds: x 135–385; y 122–366 (before stroke).</text><text x="70" y="799" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Arm transform: translate(74,53) scale(0.91).</text><text x="70" y="830" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Pedestal: filled rounded silhouette; baseline y ≈ 436.</text><text x="70" y="861" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Pedestal control envelope: x 200–312; y 401–436.</text><text x="70" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Use the supplied paths; this arm is not a perfect semicircle.</text><text x="800" y="630" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#194F59">02 / GRADIENT</text><rect x="800" y="655" width="34" height="34" rx="5" fill="#194F59"/><text x="850" y="679" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">0% · Deep teal · #194F59</text><rect x="800" y="717" width="34" height="34" rx="5" fill="#47745E"/><text x="850" y="741" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">40% · Muted green · #47745E</text><rect x="800" y="779" width="34" height="34" rx="5" fill="#A96F4D"/><text x="850" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">91% · Warm brown · #A96F4D</text><text x="800" y="878" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Direction: (0,0) → (512,512).</text><text x="800" y="908" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">userSpaceOnUse · sRGB interpolation.</text><text x="800" y="938" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">91–100% holds the final brown.</text><text x="800" y="968" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Palette colors are Maggie-approved.</text><text x="800" y="998" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">This blend is a Lucky-selected exploration.</text><text x="70" y="1015" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#194F59">03 / REPRODUCTION</text><text x="70" y="1060" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Keep the pedestal, rounded ends, bubble proportions and gradient stops intact.</text><text x="70" y="1091" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Reverse treatment: the whole mark reveals one continuous canvas-sized gradient.</text><text x="70" y="1122" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Suggested external clear space: 30 units beyond the artwork bounds.</text><text x="70" y="1153" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">24 / 32 / 64 px were visually reviewed; use 32 px or larger when space allows.</text><text x="70" y="1184" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">App icon previews use a custom rounded-square shape; platform masking needs separate production assets.</text><text x="70" y="1215" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">No wordmark is approved. TRVLR remains a placeholder.</text><text x="70" y="1300" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#194F59">04 / TYPOGRAPHY &amp; APPLICATIONS</text><text x="70" y="1345" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Maggie’s current pairing: Fredoka headings + Outfit body and interface text.</text><text x="70" y="1376" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">HTML examples load these fonts from Google Fonts; offline fallbacks can differ.</text><text x="70" y="1407" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">Letterhead and banner are application studies, not final brand lockups.</text><text x="70" y="1438" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">The technical sheet uses Arial for dependable rendering; it is not a proposed brand font.</text><text x="70" y="1469" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#194F59">See DESIGN-SPEC.md for exact paths, dimensions, usage rules and source references.</text></svg>